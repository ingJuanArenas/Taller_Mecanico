<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superadmin — Taller Amiguitos del Motor</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/superadmin.css" />
</head>
<body>
  <header class="view-header">
    <div style="display:flex; align-items:center; width:100%;">
      <h1 style="margin:0;">BIENVENIDO, <span id="welcomeName"></span></h1>
      <button type="button" id="btnLogout" class="btn btn-primary" style="margin-left:auto;">Cerrar sesión</button>
    </div>
    <div class="tabs" style="margin-top:12px; display:flex; gap:8px;">
      <button type="button" id="tabUsuarios" class="btn btn-accent">Gestionar Usuarios</button>
      <button type="button" id="tabOrdenes" class="btn btn-primary">Gestionar Órdenes</button>
    </div>
  </header>

  <main class="main-wrap">
    <div id="moduleUsuarios">
      <section id="vistaLista">
      <div class="toolbar">
        <button type="button" id="btnNuevoUsuario" class="btn btn-success btn-icon" title="Nuevo usuario">+</button>
        <label for="buscarNombre">Buscar nombre</label>
        <input type="search" id="buscarNombre" placeholder="Filtrar en esta página" autocomplete="off" />
      </div>
      <div class="card">
        <div id="usersEmpty" class="empty-msg hidden">No hay usuarios.</div>
        <div id="usersTableWrap" class="hidden">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>ROL</th>
                <th>CODIGO ACCESO</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="vistaCrear" class="hidden">
      <div class="form-page">
      <div class="card">
        <h2>Crear usuario</h2>
        <div class="form-grid">
          <div>
            <label for="uCedula">CEDULA</label>
            <input type="text" id="uCedula" inputmode="numeric" />
          </div>
          <div>
            <label for="uNombre">NOMBRE</label>
            <input type="text" id="uNombre" maxlength="200" />
          </div>
          <div>
            <label for="uRole">ROLE</label>
            <select id="uRole">
              <option value="SERVICE_ADVISOR">FACTURADOR</option>
              <option value="MECHANIC">MECÁNICO</option>
            </select>
          </div>
          <div>
            <label for="uCodigo">CODIGO</label>
            <input type="text" id="uCodigo" maxlength="20" autocomplete="off" />
          </div>
          <div class="form-actions" style="grid-column: 1 / -1;">
          <button type="button" id="btnCrearUsuario" class="btn btn-accent">CREAR</button>
          <button type="button" id="btnVolverLista" class="btn btn-primary">Volver al listado</button>
          </div>
        </div>
      </div>
      </div>
      </section>
    </div>

    <div id="moduleOrdenes" class="hidden">
      <section id="vistaOrdenes">
        <div class="card">
          <h2>Órdenes Activas</h2>
          <div id="ordEmpty" class="empty-msg hidden">No hay órdenes para intervenir.</div>
          <div id="ordTableWrap" class="hidden">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>ESTADO</th>
                  <th>PLACA</th>
                  <th>FECHA</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="ordBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="vistaIntervenir" class="hidden">
        <div class="form-page">
        <div class="card">
          <h2 id="tituloIntervenir">INTERVENIR ORDEN</h2>
          <div class="form-grid">
            <div>
              <label for="intEstado">NUEVO ESTADO</label>
              <select id="intEstado">
                <option value="CREATED">PENDIENTE (CREATED)</option>
                <option value="IN_PROGRESS">EN PROCESO (IN_PROGRESS)</option>
                <option value="COMPLETED">CANCELAR / FINALIZAR (COMPLETED)</option>
              </select>
            </div>
            <div>
              <label for="intMotivo">MOTIVO DE INTERVENCIÓN</label>
              <textarea id="intMotivo" rows="3"></textarea>
            </div>
            <div class="form-actions" style="grid-column: 1 / -1;">
              <button type="button" id="btnIntervenir" class="btn btn-accent">CONFIRMAR</button>
              <button type="button" id="btnVolverOrdenes" class="btn btn-primary">VOLVER</button>
            </div>
          </div>
        </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/superadmin.js"></script>
</body>
</html>
