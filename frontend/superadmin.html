<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superadmin — Taller Amiguitos del Motor</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/superadmin.css" />
</head>
<body>
  <header class="view-header">
    <h1>BIENVENIDO, <span id="welcomeName"></span></h1>
    <button type="button" id="btnLogout" class="btn btn-primary">Cerrar sesión</button>
  </header>

  <main class="main-wrap">
    <section id="vistaLista">
      <div class="toolbar">
        <button type="button" id="btnNuevoUsuario" class="btn btn-success btn-icon" title="Nuevo usuario">+</button>
        <label for="buscarNombre">Buscar nombre</label>
        <input type="search" id="buscarNombre" placeholder="Filtrar en esta página" autocomplete="off" />
      </div>
      <div class="card">
        <div id="usersEmpty" class="empty-msg hidden">No hay usuarios.</div>
        <div id="usersTableWrap" class="hidden">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>ROL</th>
                <th>CODIGO ACCESO</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="vistaCrear" class="hidden">
      <div class="form-page">
      <div class="card">
        <h2>Crear usuario</h2>
        <div class="form-grid">
          <div>
            <label for="uCedula">CEDULA</label>
            <input type="text" id="uCedula" inputmode="numeric" />
          </div>
          <div>
            <label for="uNombre">NOMBRE</label>
            <input type="text" id="uNombre" maxlength="200" />
          </div>
          <div>
            <label for="uRole">ROLE</label>
            <select id="uRole">
              <option value="SERVICE_ADVISOR">FACTURADOR</option>
              <option value="MECHANIC">MECÁNICO</option>
            </select>
          </div>
          <div>
            <label for="uCodigo">CODIGO</label>
            <input type="text" id="uCodigo" maxlength="20" autocomplete="off" />
          </div>
          <div class="form-actions" style="grid-column: 1 / -1;">
          <button type="button" id="btnCrearUsuario" class="btn btn-accent">CREAR</button>
          <button type="button" id="btnVolverLista" class="btn btn-primary">Volver al listado</button>
          </div>
        </div>
      </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/superadmin.js"></script>
</body>
</html>
